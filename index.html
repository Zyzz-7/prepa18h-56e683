<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Prépa 18h mc2i</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Montserrat:wght@600;700;800&display=swap">
<style>
:root{color-scheme:light;--indigo:#18178c;--indigo-d:#10105f;--fuchsia:#db1062;--fuchsia-p:#fdeaf2;--turq:#00b0a8;--turq-d:#00706b;--turq-p:#e2f7f6;--ink:#14143f;--mute:#55567a;--line:#dcdde9;--bg:#f5f6fa;--white:#fff;--hd:'Montserrat',system-ui,sans-serif;--tx:'Lato',system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.55 var(--tx);display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:var(--hd);line-height:1.2;margin:0;color:var(--indigo)}
button,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
h1:focus{outline:none}

.top{position:sticky;top:0;z-index:20;background:var(--indigo);color:#fff;display:flex;align-items:center;gap:22px;padding:0 20px;min-height:58px}
.brand{font:800 16px var(--hd);white-space:nowrap}
.tabs{display:flex;gap:6px;align-items:center}
.tabs a{font:700 14px var(--hd);text-decoration:none;padding:9px 14px;border-radius:5px;white-space:nowrap;color:#fff}
.tabs a.on{background:#fff;color:var(--indigo)}
.tabs a#tabLive{background:var(--fuchsia);color:#fff}
.tabs a#tabLive.on{background:#fff;color:var(--fuchsia)}
.hud{margin-left:auto;display:flex;gap:22px;align-items:center}
.hud div{display:flex;flex-direction:column;line-height:1.15}
.hud span{font-size:11.5px;color:#c9c9ee;white-space:nowrap}
.hud b{font:700 16px var(--hd);font-variant-numeric:tabular-nums;white-space:nowrap}
#pace.ok{color:#6fe6df}#pace.late{color:#ffb7d2}
.bar{height:5px;background:#d7d8ec;position:sticky;top:58px;z-index:20}
.bar i{display:block;height:100%;width:0;background:var(--turq);transition:width .3s}

.shell{flex:1;display:grid;grid-template-columns:292px minmax(0,1fr);min-height:0}
#path{border-right:1px solid var(--line);background:#fff;padding:18px 14px;position:sticky;top:63px;align-self:start;max-height:calc(100vh - 63px);overflow-y:auto}
.pacebox{font-size:14px;line-height:1.4;color:var(--mute);margin:0 4px 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.pacebox strong{color:var(--ink)}
.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative}
.steps li:not(:last-child)::before{content:"";position:absolute;left:21px;top:34px;bottom:-8px;width:2px;background:var(--line)}
.steps li.done:not(:last-child)::before{background:var(--turq)}
.step{display:flex;gap:11px;padding:8px 8px 10px;text-decoration:none;border-radius:6px;position:relative}
.step:hover{background:var(--bg)}
.node{flex:0 0 28px;height:28px;border-radius:50%;background:#fff;border:2px solid #b9bad3;font:800 12.5px/24px var(--hd);text-align:center;color:var(--indigo);position:relative;z-index:1}
.done .node{background:var(--turq);border-color:var(--turq);color:#06302e}
.cur .step{background:var(--fuchsia-p)}
.cur .node{background:var(--fuchsia);border-color:var(--fuchsia);color:#fff}
.st-t{display:block;font:700 13.5px/1.25 var(--hd);color:var(--ink)}
.cur .st-t{color:var(--fuchsia)}
.st-m{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.st-m.miss{color:var(--fuchsia)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.chip{font:700 10.5px/1 var(--hd);padding:3px 6px;border-radius:3px;background:var(--turq-p);color:var(--turq-d)}

#view{padding:30px 40px 44px;min-width:0}
.mod{max-width:900px;margin:0 auto}
.kick{font:700 13px var(--hd);color:var(--fuchsia);margin:0 0 6px}
.mod h1{font-size:32px;font-weight:800}
.sub{font-size:19px;color:var(--mute);margin:6px 0 16px}
.whybox{border-left:4px solid var(--turq);background:#fff;padding:11px 16px;margin:0 0 22px;font-size:17px}
.whybox b{font-family:var(--hd);font-size:13px;color:var(--turq-d);display:block}
.sec{background:#fff;border:1px solid var(--line);border-radius:7px;padding:20px 22px;margin:0 0 18px}
.sec>h2{font-size:18px;font-weight:800;margin:0 0 12px}
video.player{display:block;width:100%;max-height:62vh;background:#000;border-radius:5px}
.nomedia{background:var(--fuchsia-p);color:#8c0a3f;padding:9px 13px;border-radius:5px;font-size:15px;margin:10px 0 0}
.speed{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.speed span{font-size:14px;color:var(--mute);margin-right:4px}
.speed button{background:#fff;border:1.5px solid var(--line);border-radius:4px;padding:3px 11px;font:700 13.5px var(--hd);cursor:pointer;color:var(--indigo)}
.speed button[aria-pressed=true]{background:var(--indigo);border-color:var(--indigo);color:#fff}
details{margin-top:12px;font-size:15.5px}
summary{cursor:pointer;color:var(--indigo);font-weight:700}
details p{margin:8px 0}
.take{margin:0;padding:0;list-style:none}
.take li{padding:7px 0 7px 26px;position:relative;border-bottom:1px solid #eeeff5}
.take li:last-child{border:0}
.take li::before{content:"";position:absolute;left:4px;top:15px;width:10px;height:10px;background:var(--fuchsia);border-radius:2px}

.btn{background:var(--indigo);color:#fff;border:0;border-radius:5px;padding:10px 18px;font:700 14.5px var(--hd);cursor:pointer}
.btn:hover{background:var(--indigo-d)}
.btn.ghost{background:#fff;color:var(--indigo);box-shadow:inset 0 0 0 1.5px var(--indigo)}
.btn.ghost:hover{background:var(--bg)}
.btn.next{background:var(--fuchsia);color:#fff;font-size:16px;padding:13px 26px}
.btn.next:hover{background:#b90c52}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.q{margin:0 0 18px}
.q:last-child{margin-bottom:0}
.q-t{font-weight:900;margin:0 0 8px}
.choice{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:5px;padding:9px 13px;margin:6px 0;cursor:pointer;line-height:1.35}
.choice:hover:not(:disabled){border-color:var(--indigo)}
.choice:disabled{cursor:default;color:var(--ink)}
.choice.right{background:var(--turq-p);border-color:var(--turq);font-weight:700}
.choice.right::before{content:"✓ ";color:var(--turq-d)}
.choice.wrong{background:var(--fuchsia-p);border-color:var(--fuchsia)}
.choice.wrong::before{content:"✗ ";color:var(--fuchsia)}
.why{background:var(--bg);padding:9px 13px;border-radius:5px;margin:6px 0 0;font-size:16px}
.score{font:700 15px var(--hd);color:var(--indigo);margin-top:6px}

.drill{display:grid;grid-template-columns:128px minmax(0,1fr);gap:20px;align-items:start}
.prompt{font-size:19px;font-weight:700;margin:0 0 12px}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:8}
.ring-bg{stroke:#e4e5f0}
.ring-fg{stroke:var(--indigo);stroke-linecap:round}
.ring.low .ring-fg{stroke:var(--fuchsia)}
.ring-t{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;font:800 24px var(--hd);color:var(--indigo);font-variant-numeric:tabular-nums}
.ring.over .ring-t{color:var(--fuchsia)}
.model{background:var(--turq-p);border-radius:5px;padding:13px 16px;margin:12px 0 0;white-space:pre-line}
.eval{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.eval p{margin:0 0 8px;font-size:15px;color:var(--mute)}
.lvl{background:#fff;border:1.5px solid var(--line);border-radius:5px;padding:8px 15px;font:700 13.5px var(--hd);cursor:pointer;color:var(--ink)}
.lvl[aria-pressed=true]{background:var(--turq);border-color:var(--turq);color:#06302e}

.part h2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
audio{display:block;width:100%;margin-bottom:2px}
.seg{display:inline-flex;border:1.5px solid var(--indigo);border-radius:5px;overflow:hidden;margin:12px 0}
.seg button{background:#fff;border:0;padding:8px 15px;font:700 13.5px var(--hd);cursor:pointer;color:var(--indigo)}
.seg button[aria-pressed=true]{background:var(--indigo);color:#fff}
.prompter{display:flex;gap:18px;align-items:center;background:var(--bg);border-radius:6px;padding:13px 15px;margin:0 0 12px;min-height:74px}
.prompter .msg{font-weight:900;margin:0 0 8px}
.prompter .ring{width:88px;height:88px;flex:0 0 88px}
.prompter .ring-t{font-size:18px}
.turns{position:relative;max-height:430px;overflow-y:auto;border:1px solid var(--line);border-radius:5px;padding:6px}
.turn{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:0;border-left:4px solid transparent;border-radius:3px;padding:9px 12px;line-height:1.45;cursor:pointer}
.turn:hover{background:var(--bg)}
.turn.now{background:#ecebfb;border-left-color:var(--indigo)}
.turn.is-c.now{background:var(--fuchsia-p);border-left-color:var(--fuchsia)}
.who{display:block;font:800 11.5px var(--hd);color:var(--indigo)}
.is-c .who{color:var(--fuchsia)}
.t-mask{font-style:italic;color:var(--mute)}
.note{margin:12px 0 0;font-size:15.5px;color:var(--mute)}
.note b{color:var(--ink)}

.card-q{font:700 23px/1.3 var(--hd);color:var(--indigo);margin:0 0 14px}
.flash-top{display:flex;justify-content:space-between;font:700 14px var(--hd);color:var(--mute);margin-bottom:12px}
.flash-b{display:grid;grid-template-columns:130px minmax(0,1fr);gap:20px;align-items:start}
.pts{margin:0 0 12px;padding-left:20px}
.pts li{margin:3px 0}
.big{font:800 46px var(--hd);color:var(--indigo);margin:0}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;flex-wrap:wrap}
footer{padding:9px 20px;text-align:center;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);background:#fff}
.toast{position:fixed;right:18px;bottom:44px;background:var(--turq);color:#06302e;font:800 15px var(--hd);padding:9px 15px;border-radius:5px;z-index:40}
.testnote{background:#fff4c9;color:#5a4800;font-size:13.5px;text-align:center;padding:3px}

.live{display:flex;flex-direction:column;gap:7px;--fs:15px}
.warn-b{font:700 12.5px var(--hd);color:#8c0a3f;background:var(--fuchsia-p);text-align:center;padding:3px;border-radius:4px}
.live-h{display:flex;gap:18px;align-items:center;background:#fff;border:1.5px solid var(--indigo);border-radius:6px;padding:6px 14px}
.live-h .ol{flex:1;min-width:0;font:800 16.5px/1.25 var(--hd);color:var(--indigo)}
.live-h .rm{font-size:14px;color:var(--ink);line-height:1.25;margin-top:1px}
.clock{display:flex;align-items:center;gap:8px}
.clock b{font:800 27px var(--hd);color:var(--fuchsia);font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
.clock .btn{padding:7px 12px;font-size:13px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.col{background:#fff;border:1px solid #b9bad3;border-radius:6px;padding:7px 10px;font-size:var(--fs);line-height:1.27}
.col h2{font-size:1.02em;font-weight:800;background:var(--indigo);color:#fff;margin:-7px -10px 7px;padding:5px 10px;border-radius:5px 5px 0 0}
.blk{margin:0 0 7px;padding:0 0 6px;border-bottom:1px solid #e4e5f0}
.blk:last-child{margin:0;padding:0;border:0}
.blk label{display:flex;gap:6px;align-items:center;font:800 .92em var(--hd);color:var(--indigo);cursor:pointer}
.blk input{width:15px;height:15px;margin:0;accent-color:var(--turq-d);flex:none}
.blk ul{list-style:none;margin:3px 0 0;padding:0}
.blk li{padding:1px 0 1px 12px;position:relative;color:#0c0c30}
.blk li::before{content:"";position:absolute;left:1px;top:.5em;width:5px;height:5px;background:var(--indigo)}
.blk.phrases li{font-weight:700}
.blk.phrases li::before{background:var(--fuchsia);border-radius:50%}
.blk.facts{background:var(--turq-p);margin-left:-5px;margin-right:-5px;padding:4px 5px;border:0;border-radius:4px}
.blk.facts li{font-weight:900}
.blk.facts li::before{background:var(--turq-d)}
.blk.warn{background:var(--fuchsia-p);margin-left:-5px;margin-right:-5px;padding:4px 5px;border:0;border-radius:4px}
.blk.warn label{color:#a20b49}
.blk.warn li::before{background:var(--fuchsia);width:7px;height:2px;top:.62em}
.blk.checked ul{color:#70718f}
.blk.checked li{color:#70718f}
.notes{width:100%;height:58px;resize:none;background:#fff;color:var(--ink);border:1px solid #b9bad3;border-radius:6px;padding:6px 10px;font-size:15px;line-height:1.3;display:block}

body.is-live #path{display:none}
body.is-live .shell{grid-template-columns:minmax(0,1fr)}
body.is-live #view{padding:8px 14px}
@media (max-width:1180px){.hud{gap:14px}.brand{display:none}}
@media (max-width:999px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .live-h{flex-wrap:wrap}
  .live-h .ol{flex:1 1 100%}
  .clock{width:100%;justify-content:flex-start}
  .notes{height:110px}
}
@media (max-width:860px){
  body{font-size:16.5px}
  .top{flex-wrap:wrap;gap:6px 12px;padding:7px 12px;--h:auto}
  .tabs{width:100%}
  .tabs a{flex:1;text-align:center;padding:8px 6px;font-size:13.5px}
  .hud{margin:0;width:100%;justify-content:space-between;gap:8px}
  .hud span{font-size:10.5px}.hud b{font-size:14px}
  .bar{position:static}
  .shell{grid-template-columns:minmax(0,1fr)}
  #path{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:10px 10px 6px;min-width:0}
  .pacebox{display:none}
  .steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .steps li{flex:0 0 148px}
  .steps li::before{display:none}
  .st-m{display:none}
  #view{padding:18px 14px 30px}
  .mod h1{font-size:25px}
  .sec{padding:15px 14px}
  .drill,.flash-b{grid-template-columns:minmax(0,1fr)}
  .card-q{font-size:20px}
  .foot-nav .btn.next{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* During the interview: one topic per screen, read at a glance on a phone. */
body.is-live .hud{display:none}
body.is-live footer{display:none}
.live{display:block;max-width:760px;margin:0 auto;--fs:19px}
.lv-top{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0 8px}
.lv-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-gap:5px}
.lv-tab{font:800 15.5px var(--hd);padding:12px 2px;border:1.5px solid var(--indigo);border-radius:6px;background:#fff;color:var(--indigo);cursor:pointer;-webkit-appearance:none}
.lv-tab.on{background:var(--indigo);color:#fff}
.lv-clock{display:flex;align-items:center;margin-top:7px}
.lv-clock>*{margin-right:8px}
.lv-clock b{font:800 21px var(--hd);color:var(--fuchsia);font-variant-numeric:tabular-nums;min-width:66px}
.lv-clock .btn{padding:6px 12px;font-size:13px}
.lv-warn{margin:0 0 0 auto;font-size:12.5px;color:#8c0a3f;font-weight:700;text-align:right}
.lv-body{display:grid;grid-gap:10px}
.lv-one{grid-column:1/-1;font:800 21px/1.28 var(--hd);color:#fff;background:var(--indigo);padding:14px 16px;border-radius:8px}
.lv-blk,.lv-grp{background:#fff;border:1px solid #d3d5e6;border-radius:8px;padding:12px 16px 13px;min-width:0}
.lv-blk h2,.lv-grp h2{font:800 14px/1.2 var(--hd);letter-spacing:.04em;text-transform:uppercase;color:var(--fuchsia);margin:0 0 6px}
.lv-blk ul{list-style:none;margin:0;padding:0}
.lv-blk li{font-size:20px;line-height:1.32;color:#0c0c30;padding:6px 0;border-top:1px solid #eceef6}
.lv-blk li:first-child{border-top:0;padding-top:0}
.lv-blk li:last-child{padding-bottom:0}
.lv-blk.fact li{font-weight:700}
.lv-blk.warn{background:#fdeaf2;border-color:#f3b9d1}
.lv-blk.warn h2{color:#a20b49}
.lv-blk.warn li{color:#7b0a3c;border-top-color:#f7cfe0;font-weight:700}
.lv-grp dl{margin:0}
.lv-def{padding:9px 0;border-top:1px solid #eceef6}
.lv-def:first-child{border-top:0;padding-top:0}
.lv-def:last-child{padding-bottom:0}
.lv-def dt{font:800 19px/1.2 var(--hd);color:var(--indigo)}
.lv-def dd{margin:3px 0 0;font-size:19px;line-height:1.3;color:#0c0c30}
.lv-body .notes{grid-column:1/-1;height:120px;font-size:17px}
@media (min-width:700px){.lv-tabs{grid-template-columns:repeat(8,minmax(0,1fr))}}
@media (min-width:1000px){.live{max-width:1140px}.lv-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
body.is-live .top{position:static}
body.is-live .bar{position:static}
</style>

<body>
<header class="top">
  <div class="brand">Prépa 18h mc2i</div>
  <nav class="tabs" aria-label="Sections">
    <a id="tabPath" href="#">Parcours</a>
    <a id="tabLive" href="#live">Pendant l’entretien</a>
  </nav>
  <div class="hud">
    <div><span>Entretien dans</span><b id="cd" role="timer">--:--:--</b></div>
    <div><span>Rythme (fin 17:50)</span><b id="pace">…</b></div>
    <div><span>XP</span><b id="xp">0</b></div>
    <div><span>Badges</span><b id="bd">0</b></div>
  </div>
</header>
<div class="bar" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100" id="bar"><i id="barf"></i></div>
<div class="testnote" id="testnote" hidden>Contenu de test : le contenu réel n’est pas encore chargé.</div>
<div class="shell">
  <nav id="path" aria-label="Parcours"></nav>
  <main id="view"></main>
</div>
<footer>Préparation personnelle, sans lien officiel avec mc2i</footer>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var KEY='prepa18h-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
var S=Object.assign({cur:null,done:{},awards:{},badges:{},quiz:{},drill:{},flash:{},checks:{},notes:'',speed:1,pos:{},timer:{start:null,acc:0}},load());
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

var mods=[],cheat={},cleanups=[];
var $=function(id){return document.getElementById(id)};
function h(t,a){var e=document.createElement(t),k,v;
  if(a)for(k in a){v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}
  [].slice.call(arguments,2).flat(3).forEach(function(c){if(c==null||c===false)return;e.append(c)});return e}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function hm(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function at(H,M){var d=new Date();d.setHours(H,M,0,0);return d}
function btn(label,fn,cls){return h('button',{type:'button',class:'btn '+(cls||''),onclick:fn},label)}

var toastT;
function award(key,pts){var old=S.awards[key]||0;S.awards[key]=pts;save();hud();
  if(pts>old){var t=$('toast');t.textContent='+'+(pts-old)+' XP';t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},1500)}}
function badge(key,label){if(S.badges[key])return;S.badges[key]=label;save();hud();renderPath()}

function ring(seconds,onEnd){
  var C=2*Math.PI*44,wrap=h('div',{class:'ring'});
  wrap.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-bg" cx="50" cy="50" r="44"></circle><circle class="ring-fg" cx="50" cy="50" r="44"></circle></svg>';
